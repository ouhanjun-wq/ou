name: hexapod

on:
  push:
    paths: ["hexapod/**", ".github/workflows/hexapod.yml"]
  pull_request:
    paths: ["hexapod/**", ".github/workflows/hexapod.yml"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Host unit tests (IK, gait, robot states, gestures, tilt, protocol, commands)
        run: |
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -I hexapod/firmware/hexapod -I hexapod/firmware/glove \
              hexapod/firmware/tests/test_core.cpp -o test_core
          ./test_core
      - name: protocol.h identical in both sketches
        run: diff hexapod/firmware/hexapod/protocol.h hexapod/firmware/glove/protocol.h
      - name: Diagrams script runs
        run: python3 hexapod/docs/img/make_diagrams.py

  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sketch:
          - name: hexapod (ESP32 DevKit)
            fqbn: esp32:esp32:esp32
            path: hexapod/firmware/hexapod
          - name: glove (XIAO ESP32S3)
            fqbn: esp32:esp32:XIAO_ESP32S3
            path: hexapod/firmware/glove
    name: compile ${{ matrix.sketch.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/compile-sketches@v1
        with:
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          fqbn: ${{ matrix.sketch.fqbn }}
          sketch-paths: |
            - ${{ matrix.sketch.path }}
          enable-warnings-report: true

name: firmware

on:
  push:
    paths: ["firmware/**", "tools/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "tools/**", ".github/workflows/firmware.yml"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Host unit tests (kinematics, motion limits, teach & playback, E-stop, commands)
        run: |
          g++ -std=gnu++11 -O1 -Wall -Wextra -Werror -I firmware/arm_uno \
              firmware/tests/test_core.cpp -o test_core
          ./test_core
      - name: Python tool syntax
        run: python3 -m py_compile tools/arm_client.py

  compile-uno:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build:
          - name: normal (G7 Pro gamepad)
            flags: ""
          - name: calibration (SETUP_MODE 1)
            flags: "-DSETUP_MODE=1"
    name: compile-uno ${{ matrix.build.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          sketch-paths: |
            - firmware/arm_uno
          libraries: |
            - name: USB Host Shield Library 2.0
            - name: Servo
          cli-compile-flags: |
            - --build-property
            - compiler.cpp.extra_flags=${{ matrix.build.flags }}
          enable-warnings-report: true

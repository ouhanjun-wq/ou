name: firmware

on:
  push:
    paths: ["firmware/**", "tools/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "tools/**", ".github/workflows/firmware.yml"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Host unit tests (kinematics, motion limits, teach & playback, protection, text commands)
        run: |
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -I firmware/arm_controller \
              firmware/tests/test_core.cpp -o test_core
          ./test_core
      - name: Python tool syntax
        run: python3 -m py_compile tools/arm_client.py

  compile-arm-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/compile-sketches@v1
        with:
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            - name: esp32-bluepad32:esp32
              source-url: https://raw.githubusercontent.com/ricardoquesada/esp32-arduino-lib-builder/master/bluepad32_files/package_esp32_bluepad32_index.json
          fqbn: esp32-bluepad32:esp32:esp32
          sketch-paths: |
            - firmware/arm_controller
          enable-warnings-report: true

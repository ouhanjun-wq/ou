name: hexapod-kit

on:
  push:
    paths: ["hexapod-kit/**", "hexapod/web/build_site.py", "hexapod/docs/img/make_diagrams.py", ".github/workflows/hexapod-kit.yml"]
  pull_request:
    paths: ["hexapod-kit/**", "hexapod/web/build_site.py", "hexapod/docs/img/make_diagrams.py", ".github/workflows/hexapod-kit.yml"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Host unit tests (kinematics, gaits, gamepad logic, params, servo pulses)
        run: |
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -I hexapod-kit/firmware/hexapod_g7pro \
              hexapod-kit/firmware/tests/test_core.cpp \
              hexapod-kit/firmware/hexapod_g7pro/params.cpp hexapod-kit/firmware/hexapod_g7pro/servo_out.cpp \
              -o test_core
          ./test_core
      - name: Core headers build as C++11 (the Bluepad32 core compiles with -std=gnu++11)
        run: |
          printf '#include "params.h"\n#include "servo_out.h"\nint main(){gait::Hexapod h(gaitConfig(P)); h.update(0.02f); teleop::Teleop t(teleopLimits(P)); teleop::PadInput in; t.update(0.02f, in, h); return 0;}\n' > c11.cpp
          g++ -std=gnu++11 -Wall -Wextra -Werror -I hexapod-kit/firmware/hexapod_g7pro c11.cpp \
              hexapod-kit/firmware/hexapod_g7pro/params.cpp hexapod-kit/firmware/hexapod_g7pro/servo_out.cpp -o c11

  compile-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/compile-sketches@v1
        with:
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            - name: esp32-bluepad32:esp32
              source-url: https://raw.githubusercontent.com/ricardoquesada/esp32-arduino-lib-builder/master/bluepad32_files/package_esp32_bluepad32_index.json
          fqbn: esp32-bluepad32:esp32:esp32
          sketch-paths: |
            - hexapod-kit/firmware/hexapod_g7pro
          enable-warnings-report: true

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Diagrams regenerate without changes
        run: |
          python3 hexapod-kit/docs/img/make_diagrams.py
          git diff --exit-code -- hexapod-kit/docs/img
      - name: Website regenerates from the docs without changes
        run: |
          pip install markdown-it-py==3.0.0 mdit-py-plugins==0.4.2
          python3 hexapod/web/build_site.py hexapod-kit
          git diff --exit-code -- hexapod-kit/web

<circle cx="558.3250155251711" cy="261.63654829125664" r="5" fill="#FFFFFF" stroke="#1B2A2F" stroke-width="2"/>
<text x="568.3250155251711" y="251.63654829125664" font-size="13" text-anchor="start" font-weight="700" fill="#1B2A2F">D</text>
<circle cx="433.2018007096523" cy="242.4225755406368" r="5" fill="#FFFFFF" stroke="#1B2A2F" stroke-width="2"/>
<text x="373.2018007096523" y="232.4225755406368" font-size="13" text-anchor="start" font-weight="700" fill="#1B2A2F">H 舵盘</text>
<circle cx="432.0" cy="274.4" r="5" fill="#FFFFFF" stroke="#1B2A2F" stroke-width="2"/>
<text x="392.0" y="304.4" font-size="13" text-anchor="start" font-weight="700" fill="#1B2A2F">S 舵机轴</text>
<text x="710.4905588594934" y="546.1823616950552" font-size="13" text-anchor="start" font-weight="700" fill="#1B2A2F">指尖</text>
<text x="40" y="110" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">近节 P = OB（L₁ = 42 mm）</text>
<text x="40" y="132" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">远节 M = B → 指尖（L₂ = 46 mm）</text>
<text x="40" y="154" font-size="13" text-anchor="start" font-weight="400" fill="#E07B00">联动杆 GC = 40.5 mm（橙）</text>
<text x="40" y="176" font-size="13" text-anchor="start" font-weight="400" fill="#D23B2F">驱动连杆 HD = 39.6 mm（红）</text>
<text x="40" y="198" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">舵盘 SH = 10 mm（灰）</text>
<text x="40" y="230" font-size="13" text-anchor="start" font-weight="700" fill="#1B2A2F">此时 θ₁ = 40°，PIP 相对弯曲 θ_M − θ₁ = 34°</text>
<text x="40" y="252" font-size="13" text-anchor="start" font-weight="700" fill="#1B2A2F">舵机从伸直转过 48°</text>
<text x="40" y="470" font-size="13" text-anchor="start" font-weight="700" fill="#1B2A2F">全行程（tools/finger_linkage.py 算出并校核）：</text>
<text x="40" y="494" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">θ₁ 0° → PIP 0°   θ₁ 30° → PIP 25°   θ₁ 60° → PIP 54°   θ₁ 85° → PIP 78°</text>
<text x="40" y="520" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">传动角全程 ≥ 34°，舵机行程 107°，指尖 1 N 需要 ≤ 1.16 kg·cm（MG90S 堵转 2.0 kg·cm）</text>

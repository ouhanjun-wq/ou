<text x="24" y="36" font-size="20" text-anchor="start" font-weight="700" fill="#1B2A2F">图 3  一根手指的两个四连杆（食指，MCP 弯 40°）</text>
<text x="24" y="60" font-size="13" text-anchor="start" font-weight="400" fill="#5E6E72">驱动连杆：舵盘 H 推 / 拉近节上的 D 点 → 近节绕 MCP 转；联动杆 GC：近节一转，远节自动跟着弯</text>

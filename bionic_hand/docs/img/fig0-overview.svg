<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
<rect width="1100" height="540" fill="#FFFFFF"/>
<text x="24" y="36" font-size="20" text-anchor="start" font-weight="700" fill="#1B2A2F">图 0  系统总览：手套 → 网线 → Uno → 6 个舵机</text>
<text x="24" y="60" font-size="13" text-anchor="start" font-weight="400" fill="#5E6E72">手套上 6 个电位器量你的手指；Uno 每 20 ms 读一次、换算、滤波，再让机械手的 6 个舵机转到对应位置</text>
<rect x="40" y="110" width="200" height="150" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="140.0" y="132" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">操控手套</text>
<text x="140.0" y="150" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">6 × WH148 B10K 电位器</text>
<text x="140.0" y="166" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">4 指 + 拇指弯曲 + 拇指转动</text>
<text x="140.0" y="182" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">迷你面包板汇 5V / GND</text>
<rect x="290" y="150" width="150" height="70" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="365.0" y="172" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">RJ45 转接板</text>
<text x="365.0" y="190" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">手套端 · 螺丝端子</text>
<rect x="490" y="150" width="150" height="70" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="565.0" y="172" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">RJ45 转接板</text>
<text x="565.0" y="190" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">机械手底座端</text>
<rect x="700" y="110" width="220" height="170" rx="8" fill="#FFF3D6" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="810.0" y="132" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">Arduino Uno R3</text>
<text x="810.0" y="150" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">+ Sensor Shield V5.0</text>
<text x="810.0" y="166" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">读 A0–A5 · 标定 · 滤波</text>
<text x="810.0" y="182" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">限位 · 限速 · 手势</text>
<text x="810.0" y="198" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">设置存 EEPROM</text>
<rect x="970" y="110" width="110" height="170" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="1025.0" y="132" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">机械手</text>
<text x="1025.0" y="150" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">6 × MG90S</text>
<text x="1025.0" y="166" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">食指 中指</text>
<text x="1025.0" y="182" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">无名指 小指</text>
<text x="1025.0" y="198" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">拇指弯曲</text>
<text x="1025.0" y="214" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">拇指转动</text>
<rect x="700" y="360" width="220" height="90" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="810.0" y="382" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">舵机电源</text>
<text x="810.0" y="400" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">6 V ≥ 5 A 适配器</text>
<text x="810.0" y="416" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">（做过机械臂：直接用它的 6 V + 急停）</text>
<rect x="420" y="360" width="220" height="90" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="530.0" y="382" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">电脑 / 充电宝</text>
<text x="530.0" y="400" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">USB 5 V 给 Uno 供电</text>
<text x="530.0" y="416" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">电脑还能用串口命令调试</text>
<rect x="40" y="360" width="200" height="90" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="140.0" y="382" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">可选：按键模块</text>
<text x="140.0" y="400" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">D2 · 短按切模式</text>
<text x="140.0" y="416" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">长按 2 秒 = 引导标定</text>
<path d="M240,185 L290,185" fill="none" stroke="#1E8A5A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M440,185 L490,185" fill="none" stroke="#1E8A5A" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="465" y="172" font-size="12" text-anchor="middle" font-weight="700" fill="#1E8A5A">1 m 网线</text>
<text x="465" y="242" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">8 芯：6 路信号 + 5V + GND</text>
<path d="M640,185 L700,185" fill="none" stroke="#1E8A5A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M920,195 L968,195" fill="none" stroke="#1F6FB5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M968,195 L959.0,199.3 L959.0,190.7 Z" fill="#1F6FB5"/>
<text x="944" y="185" font-size="11" text-anchor="middle" font-weight="700" fill="#1F6FB5">PWM</text>
<path d="M810,360 L810,280" fill="none" stroke="#E07B00" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="820" y="330" font-size="12" text-anchor="start" font-weight="700" fill="#E07B00">6 V → 扩展板接线端子</text>
<path d="M640,405 L670,405 L670,250 L700,250" fill="none" stroke="#A87B00" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="676" y="330" font-size="12" text-anchor="start" font-weight="700" fill="#A87B00">USB</text>
<path d="M240,405 L320,405 L320,300 L720,300 L720,280" fill="none" stroke="#1F6FB5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<circle cx="50" cy="491" r="10" fill="#1B2A2F"/>
<text x="50" y="495.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">1</text>
<text x="68" y="495" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">全程不用焊：电位器买带线的，网线两头用 RJ45 螺丝端子转接板</text>
<circle cx="570" cy="491" r="10" fill="#1B2A2F"/>
<text x="570" y="495.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">2</text>
<text x="588" y="495" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">舵机大电流只走扩展板端子，不经过 Uno（SEL 跳帽拔掉）</text>
<path d="M40,528 L68,528" fill="none" stroke="#1E8A5A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="74" y="532" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">手套信号 / 5V</text>
<path d="M201,528 L229,528" fill="none" stroke="#1F6FB5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="235" y="532" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">舵机信号</text>
<path d="M297,528 L325,528" fill="none" stroke="#E07B00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="331" y="532" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">6 V 舵机电</text>
<path d="M432,528 L460,528" fill="none" stroke="#A87B00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="466" y="532" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">USB 5 V</text>
<path d="M567,528 L595,528" fill="none" stroke="#1F6FB5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<text x="601" y="532" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">可选</text>
</svg>
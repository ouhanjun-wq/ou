<text x="835.0" y="494" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">SEL 跳帽</text>
<text x="835.0" y="512" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">拔掉！</text>
<circle cx="360" cy="530" r="4" fill="#1F6FB5"/>
<text x="368" y="534" font-size="11.5" text-anchor="start" font-weight="600" fill="#1B2A2F">D2（可选按键 → GND）</text>
<circle cx="50" cy="596" r="10" fill="#1B2A2F"/>
<text x="50" y="600.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">1</text>
<text x="68" y="600" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">网线 4 号蓝线（5V）接 Uno 的 5V 针，</text>
<text x="68" y="622" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">不要接 A0–A5 那几排的 V 针：拔掉 SEL 后，</text>
<text x="68" y="642" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">有的扩展板那一排 V 是 6 V 舵机电，会烧模拟口</text>
<circle cx="50" cy="668" r="10" fill="#1B2A2F"/>
<text x="50" y="672.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">2</text>
<text x="68" y="672" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">5 号白蓝（GND）接任意 G 针</text>
<circle cx="810" cy="596" r="10" fill="#1B2A2F"/>
<text x="810" y="600.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">3</text>
<text x="828" y="600" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">舵机插头：棕 = G，红 = V，橙 = S</text>
<circle cx="810" cy="626" r="10" fill="#1B2A2F"/>
<text x="810" y="630.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">4</text>
<text x="828" y="630" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">舵机电和 Uno 的 GND 在扩展板上是通的</text>

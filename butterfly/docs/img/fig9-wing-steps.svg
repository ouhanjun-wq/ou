<text x="836" y="370" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">沿前缘线涂一条布胶（白管），放上碳杆</text>
<text x="836" y="390" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">留边翻过来包住碳杆，压平，按说明晾干</text>

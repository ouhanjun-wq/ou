<text x="74" y="111" font-size="15" text-anchor="start" font-weight="700" fill="#1B2A2F">剪下翼面</text>
<text x="46" y="370" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">沿印刷轮廓外留 5–8 mm 剪下</text>
<text x="46" y="390" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">电烙铁沿边烫一圈，布边不会脱丝</text>

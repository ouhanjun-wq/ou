<text x="441" y="720" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">两只翅膀重量差 ≤ 0.5 g</text>
<text x="441" y="740" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">重的那只修掉一点边缘薄膜</text>

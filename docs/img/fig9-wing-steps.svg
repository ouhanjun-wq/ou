<text x="46" y="720" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">沿碳杆外侧留 2 mm 剪下多余的膜</text>
<text x="46" y="740" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">边缘可以向下包住碳杆再点胶，更结实</text>

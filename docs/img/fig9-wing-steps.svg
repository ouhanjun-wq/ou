<text x="864" y="111" font-size="15" text-anchor="start" font-weight="700" fill="#1B2A2F">喷胶贴膜</text>
<text x="836" y="370" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">只在碳杆上喷 3M 77（先用纸遮住别处）</text>
<text x="836" y="390" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">膜从中间向四周抹平、轻轻绷紧</text>

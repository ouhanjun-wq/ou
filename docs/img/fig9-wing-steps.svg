<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
<rect width="1200" height="760" fill="#FFFFFF"/>
<text x="24" y="36" font-size="20" text-anchor="start" font-weight="700" fill="#1B2A2F">图 9  翅膀制作 6 步</text>
<text x="24" y="60" font-size="13" text-anchor="start" font-weight="400" fill="#5E6E72">每一只翅膀都按这 6 步做；左右两只最后要称重配对</text>
<rect x="30" y="80" width="370" height="330" rx="10" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.4"/>

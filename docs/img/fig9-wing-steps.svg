<text x="74" y="111" font-size="15" text-anchor="start" font-weight="700" fill="#1B2A2F">打印模板</text>
<text x="46" y="370" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">A3 纸 1:1 打印模板（不要缩放）</text>
<text x="46" y="390" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">下面垫切割垫，上面盖一层保鲜膜防粘</text>

<text x="864" y="461" font-size="15" text-anchor="start" font-weight="700" fill="#1B2A2F">装到舵机</text>
<text x="836" y="720" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">先 servo 0 0 让舵机回中位，再装</text>

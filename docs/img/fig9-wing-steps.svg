<text x="447" y="110.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">2</text>
<text x="465" y="110" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F"></text>
<text x="469" y="111" font-size="15" text-anchor="start" font-weight="700" fill="#1B2A2F">摆放碳杆</text>

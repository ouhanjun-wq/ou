<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
<rect width="1100" height="600" fill="#FFFFFF"/>
<defs><clipPath id="clip"><rect x="0" y="80" width="690" height="500"/></clipPath></defs>
<text x="24" y="36" font-size="20" text-anchor="start" font-weight="700" fill="#1B2A2F">图 6  桌面布局（俯视）：底板、机械臂、电控盒、急停</text>
<text x="24" y="60" font-size="13" text-anchor="start" font-weight="400" fill="#5E6E72">机械臂伸出去有力矩，底板必须夹在桌子上；虚线是最大伸展范围，里面不要放手和杂物</text>
<rect x="120" y="120" width="400" height="300" rx="6" fill="#EFE6D6" stroke="#2B3A3F" stroke-width="2"/>
<text x="128" y="410" font-size="12.5" text-anchor="start" font-weight="700" fill="#1B2A2F">底板 400 × 300 mm（12 mm 多层板 / 5 mm 铝板）</text>
<path d="M290,-55 A325,325 0 0 1 290,595" fill="none" stroke="#D23B2F" stroke-width="1.8" stroke-dasharray="8 6" clip-path="url(#clip)"/>
<text x="620" y="275" font-size="12.5" text-anchor="start" font-weight="700" fill="#D23B2F">最大伸展</text>
<text x="620" y="293" font-size="12.5" text-anchor="start" font-weight="700" fill="#D23B2F">≈ 325 mm</text>
<circle cx="290" cy="270" r="50" fill="#DDE6EA" stroke="#2B3A3F" stroke-width="2"/>
<text x="290" y="275" font-size="12" text-anchor="middle" font-weight="700" fill="#1B2A2F">机械臂底座</text>
<path d="M340,270 L460,270" fill="none" stroke="#1B2A2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M460,270 L451.0,274.3 L451.0,265.7 Z" fill="#1B2A2F"/>
<text x="462" y="260" font-size="12" text-anchor="middle" font-weight="700" fill="#1B2A2F">x 正前方（工作区）</text>
<rect x="135" y="215" width="90" height="110" rx="6" fill="#FFF3D6" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="180" y="255" font-size="13" text-anchor="middle" font-weight="700" fill="#1B2A2F">电控盒</text>
<text x="180" y="275" font-size="11" text-anchor="middle" font-weight="400" fill="#5E6E72">在底座后方</text>
<text x="180" y="291" font-size="11" text-anchor="middle" font-weight="400" fill="#5E6E72">手臂够不到</text>
<path d="M225,250 L240,250" fill="none" stroke="#1F6FB5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<rect x="94" y="150" width="26" height="22" rx="3" fill="#555"/>
<text x="90" y="166" font-size="12" text-anchor="end" font-weight="700" fill="#1B2A2F">DC 12 V + 开关</text>
<rect x="102" y="130" width="26" height="46" rx="4" fill="#607D8B"/>
<rect x="102" y="360" width="26" height="46" rx="4" fill="#607D8B"/>
<text x="90" y="390" font-size="12" text-anchor="end" font-weight="700" fill="#455A64">F 型夹 × 2</text>
<text x="90" y="406" font-size="11.5" text-anchor="end" font-weight="400" fill="#455A64">夹在桌边</text>
<rect x="585" y="455" width="70" height="60" rx="6" fill="#FFD54F" stroke="#7F6000" stroke-width="2"/>
<circle cx="620" cy="485" r="20" fill="#C62828" stroke="#7F0000" stroke-width="3"/>
<text x="620" y="535" font-size="13" text-anchor="middle" font-weight="700" fill="#C62828">急停盒</text>
<path d="M180,325 L180,540 L560,540 L585,500" fill="none" stroke="#E07B00" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<text x="330" y="556" font-size="11.5" text-anchor="middle" font-weight="400" fill="#E07B00">急停线（6 V 回路，18 AWG）</text>
<text x="720" y="170" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">① 底座用 4 颗 M4 螺丝固定在底板上，不要只靠胶</text>
<text x="720" y="200" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">② 电控盒放在底座正后方：J1 只转 ±90°，手臂够不到</text>
<text x="720" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">③ 急停单独装小盒，放在伸展范围外、右手边</text>
<text x="720" y="260" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">④ 底板后边夹在桌边，两把 F 型夹</text>
<text x="720" y="290" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">⑤ 第一次运行把速度调到“慢”（LB）</text>
</svg>
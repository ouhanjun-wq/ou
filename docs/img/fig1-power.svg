<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
<rect width="1100" height="720" fill="#FFFFFF"/>
<text x="24" y="36" font-size="20" text-anchor="start" font-weight="700" fill="#1B2A2F">图 1  电源：12 V → 6 V 舵机电（经过急停）/ 5 V 给 Uno</text>
<text x="24" y="60" font-size="13" text-anchor="start" font-weight="400" fill="#5E6E72">舵机电和 Uno 分开降压；大电流只走粗线，不经过 Uno</text>
<rect x="40" y="100" width="180" height="100" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="130.0" y="122" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">电源适配器</text>
<text x="130.0" y="140" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">12 V 5 A（≥ 60 W）</text>
<text x="130.0" y="156" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">DC 5.5×2.1 插头</text>
<rect x="290" y="100" width="180" height="100" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="380.0" y="122" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">DC 母座 + 保险丝</text>
<text x="380.0" y="140" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">带接线端子</text>
<text x="380.0" y="156" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">刀片保险 7.5 A</text>
<rect x="540" y="100" width="160" height="100" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="620.0" y="122" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">船型开关</text>
<text x="620.0" y="140" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">KCD4 · 16 A</text>
<path d="M220,150 L290,150" fill="none" stroke="#D23B2F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M470,150 L540,150" fill="none" stroke="#D23B2F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M700,150 L840,150 L840,260" fill="none" stroke="#D23B2F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="760" cy="150" r="5" fill="#D23B2F"/>
<path d="M760,150 L760,225 L455,225 L455,260" fill="none" stroke="#D23B2F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="710" y="114" width="36.8" height="22" rx="11" fill="#D23B2F"/>
<text x="728.4" y="129.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">12 V</text>
<rect x="740" y="260" width="200" height="110" rx="8" fill="#FFF3D6" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="840.0" y="282" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">大电流降压模块</text>
<text x="840.0" y="300" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">20 A / 300 W · CC/CV</text>
<text x="840.0" y="316" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">12 V → 6.0 V</text>
<rect x="360" y="260" width="190" height="110" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="455.0" y="282" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">MP1584EN 降压</text>
<text x="455.0" y="300" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">3 A</text>
<text x="455.0" y="316" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">12 V → 5.3 V</text>
<rect x="250" y="300" width="70" height="30" rx="3" fill="#FFFFFF" stroke="#2B3A3F" stroke-width="1.4"/>
<text x="285.0" y="319.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1B2A2F">SS14 ▶</text>
<path d="M360,315 L320,315" fill="none" stroke="#A87B00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M250,315 L210,315" fill="none" stroke="#A87B00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="40" y="265" width="170" height="100" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="125.0" y="287" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">Arduino Uno</text>
<text x="125.0" y="305" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">5V 引脚（≈ 5.0 V）</text>
<text x="125.0" y="321" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">不用 DC 口</text>
<text x="285" y="290" font-size="11" text-anchor="middle" font-weight="400" fill="#5E6E72">防 USB 倒灌</text>
<rect x="880" y="440" width="190" height="110" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="975.0" y="462" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">急停开关</text>
<text x="975.0" y="480" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">常闭 NC · 22 mm</text>
<text x="975.0" y="496" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">蘑菇头 · 10 A</text>
<rect x="420" y="440" width="360" height="110" rx="8" fill="#FFF3D6" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="600.0" y="462" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">舵机分线板（6 V 母线）</text>
<text x="600.0" y="480" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">+ 2 × 2200 µF 16 V 电解电容</text>
<text x="600.0" y="496" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">6 个舵机都从这里取电（图 3）</text>
<path d="M790,370 L790,426 L975,426 L975,440" fill="none" stroke="#E07B00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="790" cy="370" r="4" fill="#E07B00"/>
<text x="790" y="362" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1B2A2F">V+ 出</text>
<rect x="800" y="387" width="44.0" height="22" rx="11" fill="#E07B00"/>
<text x="822.0" y="402.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">6.0 V</text>
<path d="M880,520 L780,520" fill="none" stroke="#E07B00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="880" cy="520" r="4" fill="#E07B00"/>
<text x="888" y="524" font-size="11.5" text-anchor="start" font-weight="600" fill="#1B2A2F"></text>
<circle cx="780" cy="520" r="4" fill="#E07B00"/>
<text x="772" y="524" font-size="11.5" text-anchor="end" font-weight="600" fill="#1B2A2F">V+</text>
<rect x="40" y="440" width="300" height="110" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="190.0" y="462" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">急停检测分压</text>
<text x="190.0" y="480" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">舵机母线 → 10 kΩ → A3 → 10 kΩ → GND</text>
<text x="190.0" y="496" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">6 V 时 A3 ≈ 3 V</text>
<path d="M420,470 L340,470" fill="none" stroke="#E07B00" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="340" cy="470" r="4" fill="#E07B00"/>
<text x="332" y="474" font-size="11.5" text-anchor="end" font-weight="600" fill="#1B2A2F">6V</text>
<circle cx="340" cy="515" r="4" fill="#1F6FB5"/>
<text x="332" y="519" font-size="11.5" text-anchor="end" font-weight="600" fill="#1B2A2F">A3</text>
<path d="M340,515 L380,515" fill="none" stroke="#1F6FB5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="384" y="504" width="72.8" height="22" rx="11" fill="#1F6FB5"/>
<text x="420.4" y="519.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">→ Uno A3</text>
<path d="M130,200 L130,222" fill="none" stroke="#222222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="108" y="222" width="29.6" height="22" rx="11" fill="#222222"/>
<text x="122.8" y="237.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">GND</text>

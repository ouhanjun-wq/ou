<text x="840.0" y="300" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">20 A / 300 W · CC/CV</text>
<text x="840.0" y="316" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">12 V → 6.0 V</text>
<rect x="360" y="260" width="190" height="110" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="455.0" y="282" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">MP1584EN 降压</text>
<text x="455.0" y="300" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">3 A</text>
<text x="455.0" y="316" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">12 V → 5.0 V</text>
<rect x="250" y="300" width="70" height="30" rx="3" fill="#FFFFFF" stroke="#2B3A3F" stroke-width="1.4"/>
<text x="285.0" y="319.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1B2A2F">SS14 ▶</text>

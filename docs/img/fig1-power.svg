<text x="728.4" y="129.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">12 V</text>
<rect x="740" y="260" width="200" height="110" rx="8" fill="#FFF3D6" stroke="#2B3A3F" stroke-width="1.6"/>

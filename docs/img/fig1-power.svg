<text x="125.0" y="305" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">5V 引脚</text>
<text x="125.0" y="321" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">（逻辑电，见图 2）</text>
<text x="285" y="290" font-size="11" text-anchor="middle" font-weight="400" fill="#5E6E72">防 USB 倒灌</text>
<rect x="900" y="440" width="170" height="110" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="985.0" y="462" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">急停开关</text>
<text x="985.0" y="480" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">常闭 NC · 22 mm</text>
<text x="985.0" y="496" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">蘑菇头 · 10 A</text>
<rect x="660" y="440" width="180" height="110" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="750.0" y="462" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">继电器模块</text>
<text x="750.0" y="480" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">COM → NO · 10 A</text>
<text x="750.0" y="496" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">IN ← GPIO25（图 2）</text>
<rect x="420" y="440" width="180" height="110" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="510.0" y="462" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">INA226 模块</text>
<text x="510.0" y="480" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">VIN+ → VIN−</text>
<text x="510.0" y="496" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">采样电阻 0.01 Ω</text>
<rect x="40" y="440" width="320" height="110" rx="8" fill="#FFF3D6" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="200.0" y="462" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">舵机电源母线 → PCA9685 V+</text>
<text x="200.0" y="480" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">+ 2 × 2200 µF 16 V 电解电容</text>
<text x="200.0" y="496" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">6 个舵机都从这里取电（图 3）</text>

<circle cx="50" cy="636" r="10" fill="#1B2A2F"/>
<text x="50" y="640.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">1</text>
<text x="68" y="640" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">先调电压：大降压模块空载调到 6.0 V，MP1584 调到 5.0 V，调好再接负载</text>
<circle cx="50" cy="666" r="10" fill="#1B2A2F"/>
<text x="50" y="670.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">2</text>
<text x="68" y="670" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">急停串在 6 V 舵机线上：按下 = 舵机断电，机械臂会软下来（手要离开下方）</text>
<circle cx="570" cy="636" r="10" fill="#1B2A2F"/>
<text x="570" y="640.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">3</text>
<text x="588" y="640" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">继电器由 GPIO25 控制：开机默认断开，按 Menu 才给舵机上电</text>
<circle cx="570" cy="666" r="10" fill="#1B2A2F"/>
<text x="570" y="670.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">4</text>
<text x="588" y="670" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">6 V 和 GND 大电流线用 18 AWG 硅胶线，其余用 22 AWG</text>

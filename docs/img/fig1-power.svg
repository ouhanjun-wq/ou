<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
<rect width="1100" height="720" fill="#FFFFFF"/>
<text x="24" y="36" font-size="20" text-anchor="start" font-weight="700" fill="#1B2A2F">图 1  电源：12 V 输入 → 6 V 舵机电（急停 + 继电器 + 电流计）/ 5 V 主控电</text>
<text x="24" y="60" font-size="13" text-anchor="start" font-weight="400" fill="#5E6E72">舵机电和主控电分开降压；大电流只走粗线，不经过 ESP32</text>
<rect x="40" y="100" width="180" height="100" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="130.0" y="122" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">电源适配器</text>
<text x="130.0" y="140" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">12 V 5 A（≥ 60 W）</text>
<text x="130.0" y="156" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">DC 5.5×2.1 插头</text>
<rect x="290" y="100" width="180" height="100" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="380.0" y="122" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">DC 母座 + 保险丝</text>
<text x="380.0" y="140" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">带接线端子</text>
<text x="380.0" y="156" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">刀片保险 7.5 A</text>
<rect x="540" y="100" width="160" height="100" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="620.0" y="122" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">船型开关</text>
<text x="620.0" y="140" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">KCD4 · 16 A</text>

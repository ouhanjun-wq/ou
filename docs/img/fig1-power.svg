<rect x="358" y="222" width="29.6" height="22" rx="11" fill="#222222"/>
<text x="372.8" y="237.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">GND</text>
<path d="M890,370 L890,392" fill="none" stroke="#222222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="868" y="392" width="29.6" height="22" rx="11" fill="#222222"/>
<text x="882.8" y="407.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">GND</text>
<path d="M455,370 L455,392" fill="none" stroke="#222222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="433" y="392" width="29.6" height="22" rx="11" fill="#222222"/>
<text x="447.8" y="407.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">GND</text>
<path d="M125,365 L125,387" fill="none" stroke="#222222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="103" y="387" width="29.6" height="22" rx="11" fill="#222222"/>
<text x="117.8" y="402.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">GND</text>
<path d="M600,550 L600,572" fill="none" stroke="#222222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="578" y="572" width="29.6" height="22" rx="11" fill="#222222"/>
<text x="592.8" y="587.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">GND</text>
<path d="M190,550 L190,572" fill="none" stroke="#222222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="168" y="572" width="29.6" height="22" rx="11" fill="#222222"/>
<text x="182.8" y="587.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">GND</text>
<text x="1060" y="610" font-size="12" text-anchor="end" font-weight="400" fill="#5E6E72">所有 GND 汇到大降压模块的 GND 端子（星形接地）</text>
<circle cx="50" cy="636" r="10" fill="#1B2A2F"/>
<text x="50" y="640.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">1</text>
<text x="68" y="640" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">先调电压：大降压模块空载调到 6.0 V，MP1584 调到 5.3 V（经过 SS14 后约 5.0 V）</text>
<circle cx="50" cy="666" r="10" fill="#1B2A2F"/>
<text x="50" y="670.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">2</text>
<text x="68" y="670" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">急停串在 6 V 舵机线上：按下 = 舵机断电，Uno 从 A3 发现后也停掉舵机信号</text>
<circle cx="630" cy="636" r="10" fill="#1B2A2F"/>
<text x="630" y="640.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">3</text>
<text x="648" y="640" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">6 V 和 GND 大电流线用 18 AWG，其余用 22 AWG</text>
<circle cx="630" cy="666" r="10" fill="#1B2A2F"/>
<text x="630" y="670.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">4</text>
<text x="648" y="670" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">不要用 Uno 的 DC 口供电：板载稳压器带不动手柄</text>
<path d="M40,705 L68,705" fill="none" stroke="#D23B2F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="74" y="709" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">12 V</text>
<path d="M136,705 L164,705" fill="none" stroke="#E07B00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="170" y="709" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">6 V 舵机电</text>
<path d="M271,705 L299,705" fill="none" stroke="#A87B00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="305" y="709" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">5 V</text>
<path d="M354,705 L382,705" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="388" y="709" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">GND</text>
<path d="M437,705 L465,705" fill="none" stroke="#1F6FB5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="471" y="709" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">信号</text>
</svg>
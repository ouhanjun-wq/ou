<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
<rect width="1100" height="500" fill="#FFFFFF"/>
<text x="24" y="36" font-size="20" text-anchor="start" font-weight="700" fill="#1B2A2F">图 0  系统总览（Arduino Uno R3 版，全部用现成模块）</text>
<text x="24" y="60" font-size="13" text-anchor="start" font-weight="400" fill="#5E6E72">G7 Pro 插在 USB Host Shield 上；Uno 通过 I2C 让 PCA9685 驱动 6 个舵机；电脑 / AI / 语音走串口</text>

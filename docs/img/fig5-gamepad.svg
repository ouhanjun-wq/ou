<rect x="562" y="222" width="18" height="12" rx="3" fill="#9FAFB4"/>
<text x="531" y="250" font-size="10" text-anchor="middle" font-weight="700" fill="#1B2A2F">View</text>
<text x="571" y="250" font-size="10" text-anchor="middle" font-weight="700" fill="#1B2A2F">Menu</text>
<path d="M430,124 L322,95" fill="none" stroke="#5E6E72" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="318" y="100" font-size="13.5" text-anchor="end" font-weight="700" fill="#1B2A2F">LT  张开夹爪（按得越深越快）</text>
<path d="M430,150 L322,130" fill="none" stroke="#5E6E72" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="318" y="135" font-size="13.5" text-anchor="end" font-weight="700" fill="#1B2A2F">LB  速度 −（慢 / 中 / 快）</text>
<path d="M450,230 L322,195" fill="none" stroke="#5E6E72" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="318" y="200" font-size="13.5" text-anchor="end" font-weight="700" fill="#1B2A2F">左摇杆</text>
<text x="318" y="218" font-size="12.5" text-anchor="end" font-weight="400" fill="#5E6E72">关节：左右 J1 底座 · 上下 J2 大臂</text>
<text x="318" y="236" font-size="12.5" text-anchor="end" font-weight="400" fill="#5E6E72">XYZ：左右 = 左右移 · 上下 = 前后移</text>
<path d="M505,318 L322,285" fill="none" stroke="#5E6E72" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="318" y="290" font-size="13.5" text-anchor="end" font-weight="700" fill="#1B2A2F">十字键</text>
<text x="318" y="308" font-size="12.5" text-anchor="end" font-weight="400" fill="#5E6E72">← → J5 手腕旋转（两种模式）</text>
<text x="318" y="326" font-size="12.5" text-anchor="end" font-weight="400" fill="#5E6E72">↓ 删除最后一个路点（路点自动存进 EEPROM）</text>
<path d="M531,228 L322,375" fill="none" stroke="#5E6E72" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="318" y="380" font-size="13.5" text-anchor="end" font-weight="700" fill="#1B2A2F">View  切换 关节 / XYZ 模式</text>
<path d="M670,124 L778,95" fill="none" stroke="#5E6E72" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="782" y="100" font-size="13.5" text-anchor="start" font-weight="700" fill="#1B2A2F">RT  闭合夹爪（松开后自动退 3%，减轻堵转）</text>
<path d="M670,150 L778,130" fill="none" stroke="#5E6E72" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="782" y="135" font-size="13.5" text-anchor="start" font-weight="700" fill="#1B2A2F">RB  速度 +</text>
<path d="M650,205 L778,175" fill="none" stroke="#5E6E72" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="782" y="180" font-size="13.5" text-anchor="start" font-weight="700" fill="#1B2A2F">Y  回原位（HOME 姿态）</text>
<path d="M675,230 L778,205" fill="none" stroke="#5E6E72" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="782" y="210" font-size="13.5" text-anchor="start" font-weight="700" fill="#1B2A2F">B  停止（过载后按 B 恢复）</text>
<path d="M650,255 L778,235" fill="none" stroke="#5E6E72" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="782" y="240" font-size="13.5" text-anchor="start" font-weight="700" fill="#1B2A2F">A  记录路点 · 长按 2 秒清空全部</text>
<path d="M625,230 L778,265" fill="none" stroke="#5E6E72" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="782" y="270" font-size="13.5" text-anchor="start" font-weight="700" fill="#1B2A2F">X  播放一次 · 长按 1 秒循环播放</text>
<path d="M600,320 L778,315" fill="none" stroke="#5E6E72" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="782" y="320" font-size="13.5" text-anchor="start" font-weight="700" fill="#1B2A2F">右摇杆</text>
<text x="782" y="338" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">关节：上下 J3 小臂 · 左右 J4 手腕俯仰</text>
<text x="782" y="356" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">XYZ：上下 = 升降 · 左右 = 工具俯仰</text>
<path d="M571,228 L778,395" fill="none" stroke="#5E6E72" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="782" y="400" font-size="13.5" text-anchor="start" font-weight="700" fill="#1B2A2F">Menu  给舵机上电 / 停放后断电</text>
<circle cx="50" cy="516" r="10" fill="#1B2A2F"/>
<text x="50" y="520.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">1</text>
<text x="68" y="520" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">播放或执行文字指令时，动一下摇杆 / 扳机 / 十字键 ← →，控制权马上回到手柄</text>
<circle cx="50" cy="546" r="10" fill="#1B2A2F"/>
<text x="50" y="550.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">2</text>
<text x="68" y="550" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">手柄拔掉时机械臂停在原地保持姿态；正在播放的路点会继续播放完（B 或串口 STOP 停止）</text>
<circle cx="50" cy="576" r="10" fill="#1B2A2F"/>
<text x="50" y="580.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">3</text>
<text x="68" y="580" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">手柄震动：短 = 确认 · 长 = 到达极限 / 急停</text>
</svg>
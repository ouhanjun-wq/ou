<circle cx="650" cy="205" r="12" fill="#E0A800"/>
<text x="650" y="209.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">Y</text>
<circle cx="675" cy="230" r="12" fill="#C62828"/>

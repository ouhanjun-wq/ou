<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
<rect width="1100" height="620" fill="#FFFFFF"/>
<text x="24" y="36" font-size="20" text-anchor="start" font-weight="700" fill="#1B2A2F">图 1  机上电源输入：Type-C 充电 · 保护板 · 内置电池 · 电源开关</text>
<text x="24" y="60" font-size="13" text-anchor="start" font-weight="400" fill="#5E6E72">电池内置不拆；充电模块接在开关前面，所以关机也能充电</text>
<text x="40" y="100" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">⇩ 手机充电器 5 V（USB-C）</text>
<rect x="40" y="110" width="210" height="160" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="145.0" y="132" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">Type-C 充电模块</text>
<text x="145.0" y="150" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">IP2326 · 2S 升压充电</text>
<text x="145.0" y="166" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">充电电流 ≤ 180 mA</text>
<circle cx="250" cy="160" r="4" fill="#D23B2F"/>
<text x="242" y="164" font-size="11.5" text-anchor="end" font-weight="600" fill="#1B2A2F">BAT+</text>
<circle cx="250" cy="230" r="4" fill="#222222"/>
<text x="242" y="234" font-size="11.5" text-anchor="end" font-weight="600" fill="#1B2A2F">BAT−</text>
<circle cx="80" cy="270" r="4" fill="#E07B00"/>
<text x="80" y="262" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1B2A2F">VBUS 焊点</text>
<path d="M80,270 L80,299" fill="none" stroke="#E07B00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="40" y="299" width="180.8" height="22" rx="11" fill="#E07B00"/>
<text x="130.4" y="314.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">VBUS → 充电检测（图 2）</text>
<rect x="390" y="110" width="210" height="160" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="495.0" y="132" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">2S 保护板（带均衡）</text>
<text x="495.0" y="150" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">过流保护 ≥ 5 A</text>
<circle cx="390" cy="160" r="4" fill="#D23B2F"/>
<text x="398" y="164" font-size="11.5" text-anchor="start" font-weight="600" fill="#1B2A2F">P+</text>
<circle cx="390" cy="230" r="4" fill="#222222"/>
<text x="398" y="234" font-size="11.5" text-anchor="start" font-weight="600" fill="#1B2A2F">P−</text>
<circle cx="600" cy="140" r="4" fill="#D23B2F"/>
<text x="592" y="144" font-size="11.5" text-anchor="end" font-weight="600" fill="#1B2A2F">B+</text>
<circle cx="600" cy="190" r="4" fill="#8A8A8A"/>
<text x="592" y="194" font-size="11.5" text-anchor="end" font-weight="600" fill="#1B2A2F">BM</text>
<circle cx="600" cy="240" r="4" fill="#222222"/>
<text x="592" y="244" font-size="11.5" text-anchor="end" font-weight="600" fill="#1B2A2F">B−</text>
<path d="M250,160 L390,160" fill="none" stroke="#D23B2F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M250,230 L390,230" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="740" y="90" width="170" height="200" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="825.0" y="112" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">内置电池 2S</text>
<text x="825.0" y="130" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">7.4 V 180 mAh</text>
<rect x="790" y="149" width="80" height="34" rx="4" fill="#FFFFFF" stroke="#2B3A3F"/>
<text x="830" y="170" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1B2A2F">电芯 1</text>
<rect x="790" y="214" width="80" height="34" rx="4" fill="#FFFFFF" stroke="#2B3A3F"/>
<text x="830" y="235" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1B2A2F">电芯 2</text>
<circle cx="740" cy="140" r="4" fill="#D23B2F"/>
<text x="748" y="144" font-size="11.5" text-anchor="start" font-weight="600" fill="#1B2A2F">+</text>
<circle cx="740" cy="190" r="4" fill="#8A8A8A"/>
<text x="748" y="194" font-size="11.5" text-anchor="start" font-weight="600" fill="#1B2A2F">中</text>
<circle cx="740" cy="240" r="4" fill="#222222"/>
<text x="748" y="244" font-size="11.5" text-anchor="start" font-weight="600" fill="#1B2A2F">−</text>
<path d="M600,140 L740,140" fill="none" stroke="#D23B2F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M600,190 L740,190" fill="none" stroke="#8A8A8A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M600,240 L740,240" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="320" cy="160" r="5" fill="#D23B2F"/>
<circle cx="340" cy="230" r="5" fill="#222222"/>
<path d="M340,230 L340,330" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="347" y="319" width="87.2" height="22" rx="11" fill="#222222"/>
<text x="390.6" y="334.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">GND → 图 2</text>
<rect x="40" y="380" width="640" height="190" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="360.0" y="402" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">电源开关（P-MOS 软开关，只走微小电流的拨动开关控制大电流）</text>
<path d="M320,160 L320,355 L110,355 L110,470 L150,470" fill="none" stroke="#D23B2F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="150" y="445" width="130" height="50" rx="3" fill="#FFFFFF" stroke="#2B3A3F" stroke-width="1.4"/>
<text x="215.0" y="474.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1B2A2F">AO3401A</text>
<text x="160" y="440" font-size="11" text-anchor="start" font-weight="700" fill="#1B2A2F">S(2)</text>
<text x="270" y="440" font-size="11" text-anchor="end" font-weight="700" fill="#1B2A2F">D(3)</text>
<text x="215" y="512" font-size="11" text-anchor="middle" font-weight="700" fill="#1B2A2F">G(1)</text>
<path d="M280,470 L560,470 L560,330 L700,330" fill="none" stroke="#D23B2F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="707" y="319" width="209.6" height="22" rx="11" fill="#D23B2F"/>
<text x="811.8" y="334.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">SYS+ → 图 2（开关后的电源）</text>
<path d="M215,495 L215,535" fill="none" stroke="#1F6FB5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="215" cy="535" r="5" fill="#1F6FB5"/>
<path d="M110,470 L110,535 L130,535" fill="none" stroke="#D23B2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="130" y="523" width="60" height="24" rx="3" fill="#FFFFFF" stroke="#2B3A3F" stroke-width="1.4"/>
<text x="160.0" y="539.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1B2A2F">100kΩ</text>
<path d="M190,535 L215,535 L330,535" fill="none" stroke="#1F6FB5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="330" y="520" width="90" height="30" rx="3" fill="#FFFFFF" stroke="#2B3A3F" stroke-width="1.4"/>
<text x="375.0" y="539.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1B2A2F">拨动开关</text>
<path d="M420,535 L460,535" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="460" y="524" width="29.6" height="22" rx="11" fill="#222222"/>
<text x="474.8" y="539.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">GND</text>
<circle cx="110" cy="470" r="5" fill="#D23B2F"/>
<circle cx="750" cy="396" r="10" fill="#1B2A2F"/>
<text x="750" y="400.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">1</text>
<text x="768" y="400" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">充电电流设为 ≤ 1C（180 mAh 电池 ≤ 180 mA）</text>
<circle cx="750" cy="426" r="10" fill="#1B2A2F"/>
<text x="750" y="430.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">2</text>
<text x="768" y="430" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">焊电池一次只接一根线：B− → BM → B+</text>
<circle cx="750" cy="456" r="10" fill="#1B2A2F"/>
<text x="750" y="460.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">3</text>
<text x="768" y="460" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">拨动开关闭合 = G 拉到 GND = 开机</text>
<circle cx="750" cy="486" r="10" fill="#1B2A2F"/>
<text x="750" y="490.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">4</text>
<text x="768" y="490" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">AO3401A 单脚是 3(D)，另一排左 1(G) 右 2(S)</text>
<circle cx="750" cy="516" r="10" fill="#1B2A2F"/>
<text x="750" y="520.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">5</text>
<text x="768" y="520" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">通电前先量 SYS+ 与 GND 不短路</text>
<path d="M40,600 L68,600" fill="none" stroke="#D23B2F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="74" y="604" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">电池 +</text>
<path d="M136,600 L164,600" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="170" y="604" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">GND</text>
<path d="M219,600 L247,600" fill="none" stroke="#8A8A8A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="253" y="604" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">平衡线</text>
<path d="M302,600 L330,600" fill="none" stroke="#E07B00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="336" y="604" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">5 V</text>
<path d="M385,600 L413,600" fill="none" stroke="#1F6FB5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="419" y="604" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">控制</text>
</svg>
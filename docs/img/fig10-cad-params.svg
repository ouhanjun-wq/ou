<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
<rect width="1200" height="600" fill="#FFFFFF"/>
<text x="24" y="36" font-size="20" text-anchor="start" font-weight="700" fill="#1B2A2F">图 10  3D 模型参数：舵机和舵机臂怎么量</text>
<text x="24" y="60" font-size="13" text-anchor="start" font-weight="400" fill="#5E6E72">用游标卡尺量这几个尺寸，填到 cad/servo_mount.scad 和 cad/wing_root.scad 开头的参数里</text>
<rect x="140" y="170" width="130" height="250" rx="6" fill="#9EC5E8" stroke="#2B3A3F" stroke-width="1.6"/>
<rect x="95" y="230" width="220" height="14" rx="3" fill="#7DB0DE" stroke="#2B3A3F"/>
<circle cx="110" cy="237" r="4" fill="#FFFFFF" stroke="#2B3A3F"/>
<circle cx="300" cy="237" r="4" fill="#FFFFFF" stroke="#2B3A3F"/>
<circle cx="205" cy="200" r="12" fill="#FFFFFF" stroke="#2B3A3F" stroke-width="1.5"/>
<text x="205" y="385" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">舵机</text>
<text x="205" y="405" font-size="11" text-anchor="middle" font-weight="400" fill="#5E6E72">（侧面，安装耳横放）</text>
<path d="M140,150 L270,150" fill="none" stroke="#D23B2F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M140,144 L140,156" fill="none" stroke="#D23B2F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M270,144 L270,156" fill="none" stroke="#D23B2F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="205.0" y="140" font-size="12.5" text-anchor="middle" font-weight="700" fill="#D23B2F">servo_l 机身长（默认 23.0）</text>
<path d="M95,270 L315,270" fill="none" stroke="#D23B2F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M95,264 L95,276" fill="none" stroke="#D23B2F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M315,264 L315,276" fill="none" stroke="#D23B2F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="205.0" y="260" font-size="12.5" text-anchor="middle" font-weight="700" fill="#D23B2F"></text>
<text x="330" y="274" font-size="12.5" text-anchor="start" font-weight="700" fill="#D23B2F">servo_ear_span 两耳外端总长（默认 32.5）</text>
<path d="M110,320 L300,320" fill="none" stroke="#D23B2F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M110,314 L110,326" fill="none" stroke="#D23B2F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300,314 L300,326" fill="none" stroke="#D23B2F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="205.0" y="310" font-size="12.5" text-anchor="middle" font-weight="700" fill="#D23B2F"></text>
<text x="330" y="324" font-size="12.5" text-anchor="start" font-weight="700" fill="#D23B2F">servo_hole_spacing 孔距（默认 28.0）</text>
<path d="M110,242 L110,320" fill="none" stroke="#D23B2F" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<path d="M300,242 L300,320" fill="none" stroke="#D23B2F" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<text x="205" y="460" font-size="12.5" text-anchor="middle" font-weight="700" fill="#D23B2F">servo_w 机身宽 = 垂直于纸面的厚度</text>
<text x="205" y="478" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">（默认 12.0）</text>
<path d="M620,190 h260 a16,16 0 0 1 0,32 h-260 a16,16 0 0 1 0,-32 Z" fill="#FFFFFF" stroke="#2B3A3F" stroke-width="1.6"/>
<circle cx="620" cy="206" r="10" fill="#E3E8E6" stroke="#2B3A3F"/>
<circle cx="710" cy="206" r="3.5" fill="#FFFFFF" stroke="#2B3A3F"/>
<circle cx="750" cy="206" r="3.5" fill="#FFFFFF" stroke="#2B3A3F"/>
<circle cx="790" cy="206" r="3.5" fill="#FFFFFF" stroke="#2B3A3F"/>
<circle cx="830" cy="206" r="3.5" fill="#FFFFFF" stroke="#2B3A3F"/>
<circle cx="870" cy="206" r="3.5" fill="#FFFFFF" stroke="#2B3A3F"/>
<text x="750" y="160" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">单臂舵机臂（俯视）</text>
<path d="M920,190 L920,222" fill="none" stroke="#D23B2F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M914,190 L926,190" fill="none" stroke="#D23B2F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M914,222 L926,222" fill="none" stroke="#D23B2F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="938" y="210.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#D23B2F">horn_w 臂宽（默认 5.0）</text>
<text x="620" y="270" font-size="12.5" text-anchor="start" font-weight="700" fill="#D23B2F">horn_t 臂厚（默认 1.6）：用卡尺夹住臂的上下两面量</text>
<text x="620" y="294" font-size="12.5" text-anchor="start" font-weight="700" fill="#D23B2F">horn_screw_from_end：插槽口到螺丝孔的距离（默认 4）</text>
<text x="620" y="314" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">→ 让螺丝正好穿过舵机臂最外面那个孔</text>
<text x="620" y="370" font-size="12.5" text-anchor="start" font-weight="700" fill="#D23B2F">keel 主梁方管边长（默认 4.0）</text>
<text x="620" y="394" font-size="12.5" text-anchor="start" font-weight="700" fill="#D23B2F">rods：每根碳杆的 [入口位置, 角度, 直径]，默认 Ø2 前缘 + 3 根 Ø1.5</text>
<text x="620" y="418" font-size="12.5" text-anchor="start" font-weight="700" fill="#D23B2F">clearance / rod_clearance：打印余量，太紧就加 0.1</text>
<circle cx="630" cy="516" r="10" fill="#1B2A2F"/>
<text x="630" y="520.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">1</text>
<text x="648" y="520" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">改完参数：OpenSCAD 里按 F6 渲染，再 F7 导出 STL</text>
<circle cx="630" cy="546" r="10" fill="#1B2A2F"/>
<text x="630" y="550.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">2</text>
<text x="648" y="550" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">先打印一个试装，松紧合适再打印正式件</text>
</svg>
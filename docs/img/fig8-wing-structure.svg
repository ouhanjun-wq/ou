<text x="680" y="412.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">4</text>
<circle cx="330" cy="240" r="11" fill="#D23B2F" stroke="#FFFFFF" stroke-width="2"/>
<text x="330" y="244.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">5</text>
<circle cx="835" cy="300" r="11" fill="#D23B2F" stroke="#FFFFFF" stroke-width="2"/>
<text x="835" y="304.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">6</text>
<circle cx="915" cy="146" r="11" fill="#D23B2F" stroke="#FFFFFF" stroke-width="2"/>
<text x="915" y="150.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">1</text>
<text x="935" y="150" font-size="13" text-anchor="start" font-weight="700" fill="#1B2A2F">前缘：Ø2.0 mm 碳纤维实心杆</text>
<text x="935" y="168" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">最粗、受力最大，从翼根一直通到翼尖</text>
<circle cx="915" cy="198" r="11" fill="#D23B2F" stroke="#FFFFFF" stroke-width="2"/>
<text x="915" y="202.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">2</text>
<text x="935" y="202" font-size="13" text-anchor="start" font-weight="700" fill="#1B2A2F">翅脉：Ø1.5 mm 碳杆</text>
<text x="935" y="220" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">从翼根呈扇形散开，撑住翼面</text>
<circle cx="915" cy="250" r="11" fill="#D23B2F" stroke="#FFFFFF" stroke-width="2"/>
<text x="915" y="254.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">3</text>
<text x="935" y="254" font-size="13" text-anchor="start" font-weight="700" fill="#1B2A2F">横脉：Ø1.0 mm 碳杆</text>
<text x="935" y="272" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">把相邻的翅脉连起来，防止翼面扭曲</text>
<circle cx="915" cy="302" r="11" fill="#D23B2F" stroke="#FFFFFF" stroke-width="2"/>
<text x="915" y="306.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">4</text>
<text x="935" y="306" font-size="13" text-anchor="start" font-weight="700" fill="#1B2A2F">后翅杆：Ø1.5 mm 碳杆</text>
<text x="935" y="324" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">后翅的主杆，和前翅插在同一个翼根座上</text>
<circle cx="915" cy="354" r="11" fill="#D23B2F" stroke="#FFFFFF" stroke-width="2"/>
<text x="915" y="358.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">5</text>
<text x="935" y="358" font-size="13" text-anchor="start" font-weight="700" fill="#1B2A2F">翼膜：聚酯薄膜 12–15 µm</text>
<text x="935" y="376" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">绷平贴在碳杆上，越薄越轻</text>
<circle cx="915" cy="406" r="11" fill="#D23B2F" stroke="#FFFFFF" stroke-width="2"/>
<text x="915" y="410.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">6</text>
<text x="935" y="410" font-size="13" text-anchor="start" font-weight="700" fill="#1B2A2F">翼根座：3D 打印 PETG</text>
<text x="935" y="428" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">所有碳杆都插进它的孔里，再装到舵机臂上</text>
<rect x="40" y="480" width="330" height="200" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="205.0" y="502" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">剖面 A：膜和碳杆怎么贴</text>
<circle cx="205" cy="590" r="16" fill="#2F3437"/>
<path d="M70,572 L340,572" fill="none" stroke="#C9A55A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="192" cy="575" r="3" fill="#E07B00"/>
<circle cx="205" cy="575" r="3" fill="#E07B00"/>
<circle cx="218" cy="575" r="3" fill="#E07B00"/>
<text x="205" y="630" font-size="12" text-anchor="middle" font-weight="600" fill="#1B2A2F">膜在碳杆上面，胶只涂在碳杆上</text>
<text x="205" y="648" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">（整张膜都涂胶会变重、起皱）</text>
<text x="344" y="568" font-size="11.5" text-anchor="end" font-weight="400" fill="#5E6E72">膜</text>
<text x="230" y="596" font-size="11.5" text-anchor="start" font-weight="400" fill="#FFFFFF">碳杆</text>
<rect x="420" y="590" width="740" height="110" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="790.0" y="612" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F"></text>
<text x="440" y="616" font-size="14" text-anchor="start" font-weight="700" fill="#1B2A2F">剖面 B：翼根连接</text>

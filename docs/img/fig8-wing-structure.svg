<text x="24" y="36" font-size="20" text-anchor="start" font-weight="700" fill="#1B2A2F">图 8  翅膀结构（左侧一片，俯视）</text>
<text x="24" y="60" font-size="13" text-anchor="start" font-weight="400" fill="#5E6E72">前翅和后翅在翼根连在一起，由同一个舵机带动；尺寸按 Mech-Butterfly 的 A3 模板，下面数字仅供参考</text>

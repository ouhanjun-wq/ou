<text x="620" y="675" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">碳杆插进孔里 15 mm</text>
<text x="840" y="636" font-size="12" text-anchor="start" font-weight="400" fill="#1B2A2F">① 孔径比杆大 0.1–0.2 mm</text>
<text x="840" y="656" font-size="12" text-anchor="start" font-weight="400" fill="#1B2A2F">② 插入前杆头用砂纸打毛</text>
<text x="840" y="676" font-size="12" text-anchor="start" font-weight="400" fill="#1B2A2F">③ 孔口细线缠 6–8 圈 + 502 渗透</text>
</svg>
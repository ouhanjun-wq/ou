<text x="835" y="395" font-size="12" text-anchor="middle" font-weight="700" fill="#1B2A2F">翼根座</text>
<text x="835" y="411" font-size="11" text-anchor="middle" font-weight="400" fill="#5E6E72">→ 舵机臂</text>
<path d="M242,110 L822,110" fill="none" stroke="#5E6E72" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M242,102 L242,118" fill="none" stroke="#5E6E72" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>

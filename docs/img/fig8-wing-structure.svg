<text x="532" y="102" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1B2A2F">半翼展约 380–420 mm（两侧加机身约 85 cm）</text>
<path d="M210,150 L210,285" fill="none" stroke="#5E6E72" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="200" y="222" font-size="12" text-anchor="end" font-weight="600" fill="#1B2A2F">前翅宽</text>
<text x="200" y="238" font-size="11.5" text-anchor="end" font-weight="400" fill="#5E6E72">约 150–180 mm</text>
<circle cx="420" cy="176" r="11" fill="#D23B2F" stroke="#FFFFFF" stroke-width="2"/>
<text x="420" y="180.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">1</text>
<circle cx="560" cy="290" r="11" fill="#D23B2F" stroke="#FFFFFF" stroke-width="2"/>
<text x="560" y="294.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">2</text>
<circle cx="655" cy="250" r="11" fill="#D23B2F" stroke="#FFFFFF" stroke-width="2"/>
<text x="655" y="254.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">3</text>

<text x="570" y="418" font-size="15" text-anchor="start" font-weight="700" fill="#1F6FB5">起立 / 趴下</text>
<text x="570" y="448" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">趴着 → 站起来</text>
<text x="570" y="468" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">站着 → 趴下、舵机断电</text>

<text x="200.72077938642144" y="608.2792206135786" font-size="11" text-anchor="middle" font-weight="400" fill="#5E6E72">(-60, 40, 135°)</text>
<path d="M472.0,242.0 L567.4594154601839,146.54058453981608" fill="none" stroke="#1F6FB5" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="567.5" cy="146.5" r="9" fill="#1F6FB5"/>
<text x="599.2792206135786" y="119.72077938642144" font-size="14" text-anchor="middle" font-weight="700" fill="#1F6FB5">3 RF</text>
<text x="599.2792206135786" y="137.72077938642144" font-size="11" text-anchor="middle" font-weight="400" fill="#5E6E72">(60, -40, -45°)</text>
<path d="M490.0,350.0 L625.0,350.0" fill="none" stroke="#E07B00" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="625.0" cy="350.0" r="9" fill="#E07B00"/>
<text x="670.0" y="355.0" font-size="14" text-anchor="middle" font-weight="700" fill="#E07B00">4 RM</text>
<text x="670.0" y="373.0" font-size="11" text-anchor="middle" font-weight="400" fill="#5E6E72">(0, -50, -90°)</text>
<path d="M472.0,458.0 L567.4594154601839,553.4594154601839" fill="none" stroke="#1F6FB5" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="567.5" cy="553.5" r="9" fill="#1F6FB5"/>

<path d="M400,350 L400,260" fill="none" stroke="#D23B2F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M400,260 L404.3,269.0 L395.7,269.0 Z" fill="#D23B2F"/>
<text x="408" y="270" font-size="13" text-anchor="start" font-weight="700" fill="#D23B2F">x 前</text>
<path d="M400,350 L310,350" fill="none" stroke="#1E8A5A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M310,350 L319.0,345.7 L319.0,354.3 Z" fill="#1E8A5A"/>
<text x="312" y="340" font-size="13" text-anchor="start" font-weight="700" fill="#1E8A5A">y 左</text>
<text x="408" y="370" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">原点：机身中心</text>
<text x="740" y="120" font-size="14" text-anchor="start" font-weight="700" fill="#1B2A2F">MOUNT 腿号 x y 角度</text>
<text x="740" y="150" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">x, y：髋轴在机身上的位置（mm）</text>
<text x="740" y="174" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">角度：这条腿伸出去的方向</text>
<text x="740" y="198" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">（0° = 正前，90° = 正左，−90° = 正右）</text>
<text x="740" y="222" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72"></text>
<text x="740" y="246" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">量法（组装指南第 5 步）：</text>
<text x="740" y="270" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">1. 找机身中心（对角线交点）</text>
<text x="740" y="294" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">2. 量每个髋轴到中心的前后距离 x</text>
<text x="740" y="318" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">   和左右距离 y（左正右负）</text>
<text x="740" y="342" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">3. 角度：看套件结构，一般前后腿 ±45°、</text>
<text x="740" y="366" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">   ±135°，中间腿 ±90°</text>
<text x="740" y="390" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72"></text>
<text x="740" y="414" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">括号里是默认值，按你的套件改。</text>
<text x="740" y="438" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">差 5 mm 以内问题不大。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
<rect width="1100" height="700" fill="#FFFFFF"/>
<text x="24" y="36" font-size="20" text-anchor="start" font-weight="700" fill="#1B2A2F">图 2  机器人接线（套件的 ESP32 + 舵机扩展板）</text>
<text x="24" y="60" font-size="13" text-anchor="start" font-weight="400" fill="#5E6E72">舵机、电池照套件说明插好；本项目只加两样：电压检测模块（必做）和 HC-SR04（可选）</text>
<rect x="40" y="110" width="210" height="120" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="145.0" y="132" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">2 × 18650 电池盒</text>
<text x="145.0" y="150" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">套件自带 · 满电 8.4 V</text>
<text x="145.0" y="166" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">标称 7.4 V</text>
<rect x="330" y="90" width="400" height="330" rx="8" fill="#E3F1F4" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="530.0" y="112" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">舵机扩展板（套件）</text>
<rect x="420" y="140" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="530.0" y="162" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">ESP32 DevKit</text>
<text x="530.0" y="180" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">插在扩展板中间</text>
<text x="530.0" y="196" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">USB-C 接电脑</text>
<text x="530" y="262" font-size="13" text-anchor="middle" font-weight="700" fill="#1B2A2F">18 路舵机插座（左右两排）</text>
<text x="530" y="282" font-size="12" text-anchor="middle" font-weight="400" fill="#5E6E72">舵机线：棕 = GND · 红 = V+ · 橙 = 信号</text>
<text x="530" y="312" font-size="12" text-anchor="middle" font-weight="400" fill="#1E8A5A">A 型：板上有 PCA9685 芯片（SCAN 看到 0x40）</text>
<text x="530" y="332" font-size="12" text-anchor="middle" font-weight="400" fill="#1F6FB5">B 型：插座直连 ESP32 引脚（SCAN 什么都没有）</text>
<text x="530" y="362" font-size="12" text-anchor="middle" font-weight="400" fill="#5E6E72">电源开关 · 板载降压给舵机（先用万用表量！）</text>
<path d="M250,150 L330,150" fill="none" stroke="#D23B2F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M250,190 L330,190" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="290" y="142" font-size="14" text-anchor="middle" font-weight="700" fill="#D23B2F">+</text>
<text x="290" y="182" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">−</text>
<text x="145" y="256" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">电源开关后面并一路出来 →</text>
<rect x="106.0" y="269" width="44.0" height="22" rx="11" fill="#D23B2F"/>
<text x="128.0" y="284.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">VBAT+</text>
<rect x="160" y="269" width="29.6" height="22" rx="11" fill="#222222"/>
<text x="174.8" y="284.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">GND</text>
<rect x="800" y="100" width="260" height="150" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="930.0" y="124" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">电压检测模块（学习套件）</text>
<text x="930.0" y="142" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">0–25 V · 5 : 1 分压</text>
<text x="816" y="176" font-size="11.5" text-anchor="start" font-weight="600" fill="#1B2A2F">端子 VCC</text>
<rect x="890" y="161" width="44.0" height="22" rx="11" fill="#D23B2F"/>
<text x="912.0" y="176.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">VBAT+</text>
<text x="816" y="200" font-size="11.5" text-anchor="start" font-weight="600" fill="#1B2A2F">端子 GND</text>
<rect x="890" y="185" width="29.6" height="22" rx="11" fill="#222222"/>
<text x="904.8" y="200.5" font-size="11.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">GND</text>
<text x="816" y="224" font-size="11.5" text-anchor="start" font-weight="600" fill="#1F6FB5">S → GPIO34</text>
<text x="920" y="224" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">− → GND · + 不接</text>
<text x="816" y="242" font-size="11" text-anchor="start" font-weight="400" fill="#5E6E72">8.4 V → 1.68 V（ESP32 最高 3.3 V）</text>
<rect x="800" y="280" width="260" height="200" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="930.0" y="304" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">HC-SR04（可选，学习套件）</text>
<text x="930.0" y="322" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">装在套件的超声波支架上</text>
<text x="816" y="354" font-size="11.5" text-anchor="start" font-weight="600" fill="#1B2A2F">VCC → 5V（VIN）  GND → GND</text>
<text x="816" y="376" font-size="11.5" text-anchor="start" font-weight="600" fill="#1B2A2F">TRIG → 空闲引脚（如 GPIO25）</text>
<text x="816" y="398" font-size="11.5" text-anchor="start" font-weight="600" fill="#1B2A2F">ECHO →</text>
<rect x="870" y="386" width="60" height="22" rx="3" fill="#FFFFFF" stroke="#2B3A3F" stroke-width="1.4"/>
<text x="900.0" y="401.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1B2A2F">1 kΩ</text>
<path d="M930,397 L960,397" fill="none" stroke="#1F6FB5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="960" cy="397" r="5" fill="#1F6FB5"/>
<text x="968" y="401" font-size="11.5" text-anchor="start" font-weight="700" fill="#1F6FB5">GPIO26</text>
<path d="M960,397 L960,418" fill="none" stroke="#1F6FB5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="930" y="418" width="60" height="22" rx="3" fill="#FFFFFF" stroke="#2B3A3F" stroke-width="1.4"/>
<text x="960.0" y="433.0" font-size="11" text-anchor="middle" font-weight="600" fill="#1B2A2F">2 kΩ</text>
<text x="1000" y="434" font-size="11.5" text-anchor="start" font-weight="600" fill="#1B2A2F">→ GND</text>
<text x="816" y="466" font-size="11.5" text-anchor="start" font-weight="700" fill="#D23B2F">ECHO 是 5 V，必须分压到 3.3 V</text>
<text x="40" y="470" font-size="14" text-anchor="start" font-weight="700" fill="#1B2A2F">默认舵机通道（CHMAP）：A 型板 0x40 = 0–15、0x41 = 16–31；B 型板写 GPIO 号</text>
<text x="60" y="502" font-size="13" text-anchor="start" font-weight="700" fill="#1B2A2F">腿</text>
<text x="210" y="502" font-size="13" text-anchor="start" font-weight="700" fill="#1B2A2F">髋 coxa</text>
<text x="360" y="502" font-size="13" text-anchor="start" font-weight="700" fill="#1B2A2F">大腿 femur</text>
<text x="510" y="502" font-size="13" text-anchor="start" font-weight="700" fill="#1B2A2F">小腿 tibia</text>
<text x="60" y="528" font-size="12.5" text-anchor="start" font-weight="600" fill="#1B2A2F">0 LF 左前</text>
<text x="210" y="528" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">0</text>
<text x="360" y="528" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">1</text>
<text x="510" y="528" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">2</text>
<text x="60" y="554" font-size="12.5" text-anchor="start" font-weight="600" fill="#1B2A2F">1 LM 左中</text>
<text x="210" y="554" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">3</text>
<text x="360" y="554" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">4</text>
<text x="510" y="554" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">5</text>
<text x="60" y="580" font-size="12.5" text-anchor="start" font-weight="600" fill="#1B2A2F">2 LR 左后</text>
<text x="210" y="580" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">6</text>
<text x="360" y="580" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">7</text>
<text x="510" y="580" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">8</text>
<text x="60" y="606" font-size="12.5" text-anchor="start" font-weight="600" fill="#1B2A2F">3 RF 右前</text>
<text x="210" y="606" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">16</text>
<text x="360" y="606" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">17</text>
<text x="510" y="606" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">18</text>
<text x="60" y="632" font-size="12.5" text-anchor="start" font-weight="600" fill="#1B2A2F">4 RM 右中</text>
<text x="210" y="632" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">19</text>
<text x="360" y="632" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">20</text>
<text x="510" y="632" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">21</text>
<text x="60" y="658" font-size="12.5" text-anchor="start" font-weight="600" fill="#1B2A2F">5 RR 右后</text>
<text x="210" y="658" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">22</text>
<text x="360" y="658" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">23</text>
<text x="510" y="658" font-size="12.5" text-anchor="start" font-weight="400" fill="#1B2A2F">24</text>
<text x="700" y="530" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">舵机编号 s = 腿 × 3 + 关节</text>
<text x="700" y="556" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">SCAN 看板子是哪一型，</text>
<text x="700" y="582" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">再按板上丝印用 CHMAP 一次写 18 个</text>
</svg>
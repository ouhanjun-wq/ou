<text x="68" y="700" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">降压模块先单独通电，万用表确认 5.0–5.2 V，再接任何负载</text>
<circle cx="50" cy="724" r="10" fill="#1B2A2F"/>

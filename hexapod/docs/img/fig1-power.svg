<circle cx="610" cy="724" r="10" fill="#1B2A2F"/>
<text x="610" y="728.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">5</text>
<text x="628" y="728" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">通电前先量 VIN、5V_SV 和 GND 之间不短路</text>

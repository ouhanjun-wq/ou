<text x="68" y="728" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">1N5819 防止插着 USB 时电流倒灌进舵机电源（Seeker 原版 PCB 也是这样做的）</text>
<circle cx="50" cy="752" r="10" fill="#1B2A2F"/>

<text x="892" y="599" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">SCL → D5</text>
<text x="892" y="616" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">SDA → D4</text>

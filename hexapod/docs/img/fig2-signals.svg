<text x="52" y="582" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">VCC → 3V3</text>
<text x="52" y="599" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">GND → GND</text>
<text x="52" y="616" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">SDA → D4 · SCL → D5</text>
<text x="52" y="633" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">OE → D0（加 10 kΩ 到 3V3）</text>
<text x="52" y="650" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">V+ → 5V_SV</text>
<rect x="250" y="540" width="190" height="160" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>

<text x="262" y="599" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">SDA → D4 · SCL → D5</text>
<text x="262" y="616" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">INT → D1</text>
<text x="262" y="633" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">DI(ADR) → 3V3 = 0x4B</text>
<text x="262" y="650" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">RST 悬空（板上有上拉）</text>
<rect x="460" y="540" width="190" height="160" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>

<text x="472" y="582" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">5V → 5V_SV · GND → GND</text>
<text x="472" y="599" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">雷达 RX ← D6</text>
<text x="472" y="616" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">雷达 TX → D7</text>
<text x="472" y="633" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">线序看雷达丝印 / 手册</text>
<rect x="670" y="540" width="190" height="160" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="765.0" y="562" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">MAX98357A</text>
<text x="682" y="582" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">VIN → 5V_SV · GND</text>
<text x="682" y="599" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">BCLK ← D8 · LRC ← D9</text>
<text x="682" y="616" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">DIN ← D10</text>
<text x="682" y="633" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">SD 悬空 = 左右混音</text>
<text x="682" y="650" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">喇叭接 + / −</text>

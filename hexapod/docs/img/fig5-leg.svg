<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
<rect width="1100" height="560" fill="#FFFFFF"/>
<text x="24" y="36" font-size="20" text-anchor="start" font-weight="700" fill="#1B2A2F">图 5  一条腿：尺寸、角度方向、标定姿态</text>
<text x="24" y="60" font-size="13" text-anchor="start" font-weight="400" fill="#5E6E72">标定姿态（全部关节 = 0°）：髋关节垂直于机身侧边，大腿水平，小腿竖直向下</text>
<rect x="30" y="180" width="60" height="40" rx="4" fill="#DDE6EA" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="60" y="240" font-size="12" text-anchor="middle" font-weight="400" fill="#5E6E72">机身</text>
<path d="M90,155 L90,245" fill="none" stroke="#5E6E72" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<text x="90" y="148" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">髋轴（竖直）</text>
<path d="M90,200 L151.60000000000002,200" fill="none" stroke="#1F6FB5" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M151.60000000000002,200 L250.60000000000002,200" fill="none" stroke="#E07B00" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M250.60000000000002,200 L250.60000000000002,365.0" fill="none" stroke="#1E8A5A" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="90" cy="200" r="8" fill="#FFFFFF" stroke="#1B2A2F" stroke-width="2.5"/>
<circle cx="151.60000000000002" cy="200" r="8" fill="#FFFFFF" stroke="#1B2A2F" stroke-width="2.5"/>
<circle cx="250.60000000000002" cy="200" r="8" fill="#FFFFFF" stroke="#1B2A2F" stroke-width="2.5"/>
<circle cx="250.60000000000002" cy="365.0" r="6" fill="#1B2A2F"/>
<path d="M20,373.0 L410.6,373.0" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="30" y="393.0" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">地面</text>
<text x="120.80000000000001" y="184" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1F6FB5">L1 髋</text>
<text x="201.10000000000002" y="184" font-size="12.5" text-anchor="middle" font-weight="700" fill="#E07B00">L2 大腿</text>
<text x="264.6" y="282.5" font-size="12.5" text-anchor="start" font-weight="700" fill="#1E8A5A">L3 小腿</text>
<text x="264.6" y="302.5" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">（量到脚尖）</text>
<path d="M211.60000000000002,192 L206.60000000000002,160" fill="none" stroke="#E07B00" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M206.60000000000002,160 L212.3,168.2 L203.7,169.6 Z" fill="#E07B00"/>
<text x="215.60000000000002" y="156" font-size="12" text-anchor="start" font-weight="700" fill="#E07B00">q1 大腿 +：抬起</text>
<path d="M258.6,335.0 L290.6,325.0" fill="none" stroke="#1E8A5A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M290.6,325.0 L283.3,331.8 L280.7,323.5 Z" fill="#1E8A5A"/>
<text x="294.6" y="325.0" font-size="12" text-anchor="start" font-weight="700" fill="#1E8A5A">q2 小腿 +：脚往外张</text>
<text x="30" y="435.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">height = 髋平面离地高度（站立 55 mm）</text>
<text x="30" y="457.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">sit_height = 趴下时（机身贴地）</text>
<path d="M45,200 L45,373.0" fill="none" stroke="#5E6E72" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<text x="40" y="322.5" font-size="11.5" text-anchor="end" font-weight="400" fill="#5E6E72">height</text>
<rect x="640" y="180" width="80" height="300" rx="8" fill="#DDE6EA" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="680" y="505" font-size="12" text-anchor="middle" font-weight="400" fill="#5E6E72">机身（俯视，左侧）</text>
<path d="M720,330 L990,330" fill="none" stroke="#5E6E72" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<text x="994" y="334" font-size="11.5" text-anchor="start" font-weight="400" fill="#5E6E72">安装方向（q0 = 0）</text>
<path d="M720,330 L901.26155740733,245.47634765186012" fill="none" stroke="#1F6FB5" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="720" cy="330" r="8" fill="#FFFFFF" stroke="#1B2A2F" stroke-width="2.5"/>
<circle cx="901.3" cy="245.5" r="6" fill="#1B2A2F"/>
<path d="M850,330 A130,130 0 0 0 837.8,275.1" fill="none" stroke="#1F6FB5" stroke-width="2.2"/>
<text x="860" y="308" font-size="12" text-anchor="start" font-weight="700" fill="#1F6FB5">q0 髋 +：逆时针（俯视）</text>
<text x="780" y="370" font-size="12" text-anchor="start" font-weight="400" fill="#5E6E72">reach = 脚尖到髋轴的水平距离（默认 75 mm）</text>
<text x="640" y="120" font-size="13.5" text-anchor="start" font-weight="700" fill="#1B2A2F">舵机脉宽 = 1500 + trim + dir × 11.1 µs/° × 角度</text>
<text x="640" y="142" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">trim：标定姿态下对准；dir：转反了就改成 −1</text>
</svg>
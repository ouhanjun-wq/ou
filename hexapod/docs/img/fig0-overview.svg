<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
<rect width="1100" height="470" fill="#FFFFFF"/>
<text x="24" y="36" font-size="20" text-anchor="start" font-weight="700" fill="#1B2A2F">图 0  系统总览：体感手套 → 六足机器人</text>
<text x="24" y="60" font-size="13" text-anchor="start" font-weight="400" fill="#5E6E72">手指弯成的手势选模式，手掌的倾斜角度定速度；手套和机器人都是 ESP32，用 ESP-NOW 直连（不需要路由器）</text>
<rect x="40" y="100" width="300" height="170" rx="8" fill="#FFF3D6" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="190.0" y="130" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">体感手套</text>
<text x="190.0" y="148" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">XIAO ESP32S3（带锂电池充电）</text>
<text x="190.0" y="164" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">MPU6050 陀螺仪：手掌倾角</text>
<text x="190.0" y="180" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">5 × 弯曲传感器：手指弯曲</text>
<text x="190.0" y="196" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">按键：解锁 / 锁定、长按标定</text>
<text x="190.0" y="212" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">振动马达：反馈</text>
<text x="190.0" y="228" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">3.7 V 锂电池 + 开关</text>
<rect x="760" y="100" width="300" height="170" rx="8" fill="#E3F1F4" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="910.0" y="130" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">六足机器人（套件）</text>
<text x="910.0" y="148" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">ESP32 DevKit：步态 + 逆运动学</text>
<text x="910.0" y="164" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">舵机扩展板 + 开关</text>
<text x="910.0" y="180" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">18 × MG90S（每条腿 3 个）</text>
<text x="910.0" y="196" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">2 × 18650（7.4 V）</text>
<text x="910.0" y="212" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">电压检测模块：电量</text>
<text x="910.0" y="228" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">可选：HC-SR04 避障</text>
<path d="M345,170 L752,170" fill="none" stroke="#1F6FB5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M752,170 L743.0,174.3 L743.0,165.7 Z" fill="#1F6FB5"/>
<text x="548" y="158" font-size="14" text-anchor="middle" font-weight="700" fill="#1F6FB5">ESP-NOW · 50 次 / 秒</text>
<text x="548" y="194" font-size="12" text-anchor="middle" font-weight="400" fill="#5E6E72">模式（走 / 横移 / 机身 / 停）+ 速度 + 事件（起立 / 换步态）</text>
<path d="M752,240 L350,240" fill="none" stroke="#8A8A8A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<path d="M360,240 L345,240" fill="none" stroke="#8A8A8A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M345,240 L354.0,235.7 L354.0,244.3 Z" fill="#8A8A8A"/>
<text x="548" y="230" font-size="12" text-anchor="middle" font-weight="400" fill="#5E6E72">状态 · 5 次 / 秒：电量低、前方有障碍 → 手套振动</text>
<rect x="430" y="262" width="240" height="60" rx="8" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="550.0" y="286" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">电脑（可选）</text>
<text x="550.0" y="304" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">USB 串口 115200：标定、测试指令</text>
<path d="M670,292 L820,292 L820,270" fill="none" stroke="#1F6FB5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<rect x="40" y="370" width="130" height="70" rx="8" fill="#FFF3D6" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="105.0" y="392" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">手指弯曲</text>
<text x="105.0" y="410" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">5 个 ADC</text>
<path d="M170,405 L190,405" fill="none" stroke="#1B2A2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M190,405 L181.0,409.3 L181.0,400.7 Z" fill="#1B2A2F"/>
<rect x="190" y="370" width="130" height="70" rx="8" fill="#FFF3D6" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="255.0" y="392" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">手势</text>
<text x="255.0" y="410" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">张开 / 食指 / 剪刀手…</text>
<path d="M320,405 L340,405" fill="none" stroke="#1B2A2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M340,405 L331.0,409.3 L331.0,400.7 Z" fill="#1B2A2F"/>
<rect x="340" y="370" width="130" height="70" rx="8" fill="#FFF3D6" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="405.0" y="392" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">模式</text>
<text x="405.0" y="410" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">走 / 横移 / 机身</text>
<path d="M470,405 L490,405" fill="none" stroke="#1B2A2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M490,405 L481.0,409.3 L481.0,400.7 Z" fill="#1B2A2F"/>
<rect x="490" y="370" width="130" height="70" rx="8" fill="#FFF3D6" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="555.0" y="392" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">手掌倾角</text>
<text x="555.0" y="410" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">死区 + 指数曲线</text>
<path d="M620,405 L640,405" fill="none" stroke="#1B2A2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M640,405 L631.0,409.3 L631.0,400.7 Z" fill="#1B2A2F"/>
<rect x="640" y="370" width="130" height="70" rx="8" fill="#E3F1F4" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="705.0" y="392" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">步态</text>
<text x="705.0" y="410" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">三角 / 涟漪 / 波浪</text>
<path d="M770,405 L790,405" fill="none" stroke="#1B2A2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M790,405 L781.0,409.3 L781.0,400.7 Z" fill="#1B2A2F"/>
<rect x="790" y="370" width="130" height="70" rx="8" fill="#E3F1F4" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="855.0" y="392" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">逆运动学</text>
<text x="855.0" y="410" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">每条腿 3 个角度</text>
<path d="M920,405 L940,405" fill="none" stroke="#1B2A2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

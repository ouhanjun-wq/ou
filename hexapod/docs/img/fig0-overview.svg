<text x="1005.0" y="392" font-size="14" text-anchor="middle" font-weight="700" fill="#1B2A2F">18 路舵机</text>
<text x="1005.0" y="410" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5E6E72">PCA9685 或 GPIO</text>

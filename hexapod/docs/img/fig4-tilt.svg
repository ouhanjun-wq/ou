<text x="24" y="60" font-size="13" text-anchor="start" font-weight="400" fill="#5E6E72">倾角从标定时“手掌放平”的姿态算起；小于 8° 不动（死区），35° 最快，中间是平滑的指数曲线</text>
<text x="200" y="100" font-size="13" text-anchor="middle" font-weight="700" fill="#1B2A2F">前后倾（从拇指一侧看，手指朝右）</text>

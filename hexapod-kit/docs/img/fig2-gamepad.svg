<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
<rect width="900" height="560" fill="#FFFFFF"/>
<text x="24" y="36" font-size="20" text-anchor="start" font-weight="700" fill="#1B2A2F">G7 Pro 按键图</text>
<text x="24" y="60" font-size="13" text-anchor="start" font-weight="400" fill="#5E6E72">Xbox 布局；手柄断开时机器人自动停下站稳</text>
<path d="M300,200 Q450,170 600,200 Q655,210 665,310 Q680,440 620,450 Q580,455 545,380 L355,380 Q320,455 280,450 Q220,440 235,310 Q245,210 300,200 Z" fill="#F3F6F5" stroke="#2B3A3F" stroke-width="2"/>

<rect x="535" y="168" width="90" height="20" rx="10" fill="#FFFFFF" stroke="#2B3A3F" stroke-width="1.6"/>
<text x="320" y="183" font-size="12" text-anchor="middle" font-weight="700" fill="#1B2A2F">LB</text>
<text x="580" y="183" font-size="12" text-anchor="middle" font-weight="700" fill="#1B2A2F">RB</text>
<circle cx="320" cy="260" r="30" fill="#FFFFFF" stroke="#2B3A3F" stroke-width="2"/>
<circle cx="320" cy="260" r="17" fill="#5E6E72"/>

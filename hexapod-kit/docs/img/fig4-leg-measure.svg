<circle cx="620" cy="364" r="10" fill="#1B2A2F"/>
<text x="620" y="368.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">2</text>
<text x="638" y="368" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">图上数字是默认值（毫米），</text>
<text x="638" y="390" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">只是估计，一定要自己量</text>

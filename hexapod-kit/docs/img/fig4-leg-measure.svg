<text x="620" y="290.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">1</text>
<text x="638" y="290" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">装配姿态 = 所有关节角 0°：</text>
<text x="638" y="312" font-size="12.5" text-anchor="start" font-weight="400" fill="#5E6E72">大腿水平，小腿竖直朝下，</text>

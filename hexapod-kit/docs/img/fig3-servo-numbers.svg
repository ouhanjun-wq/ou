<text x="50" y="615.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">1</text>
<text x="68" y="615" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">关节 0 基节（coxa）：+ = 俯视逆时针摆。关节 1 大腿（femur）：+ = 抬起</text>
<circle cx="50" cy="639" r="10" fill="#1B2A2F"/>
<text x="50" y="643.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">2</text>
<text x="68" y="643" font-size="13" text-anchor="start" font-weight="400" fill="#1B2A2F">关节 2 小腿（tibia）：+ = 膝盖张开、脚尖往外。方向反了就用 dir 命令翻过来</text>
<circle cx="50" cy="667" r="10" fill="#1B2A2F"/>
<text x="50" y="671.5" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">3</text>
